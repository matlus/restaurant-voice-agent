# Runs the README's checks and builds the image on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.5"
          python-version: "3.14"
      - name: Install from the lock file
        run: uv sync --frozen --all-packages --all-groups
      - name: Lint
        run: uv run --frozen --all-packages --all-groups ruff check .
      - name: Format
        run: uv run --frozen --all-packages --all-groups ruff format --check .
      - name: Types
        run: uv run --frozen --all-packages --all-groups pyright
      # The coverage floor is set in pyproject.toml, so a run below it fails here and locally alike.
      - name: Tests with coverage
        run: uv run --frozen --all-packages --all-groups pytest -q --cov

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the image
        run: docker build --tag voice-agent-web:ci .
