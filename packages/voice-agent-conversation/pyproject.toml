[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-conversation"
version = "0.1.0"
description = "Real-time voice conversations with the restaurant's agent, over a speech-to-speech provider."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Shiv Kumar" }]
dependencies = [
    "openai[realtime]>=3.46.0",
    "voice-agent-restaurant",
]

[tool.uv.sources]
voice-agent-restaurant = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voice_agent_conversation*"]
namespaces = false

[tool.setuptools.package-data]
"voice_agent_conversation" = ["py.typed", "catalog_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
pythonpath = ["src", "tests", "../voice-agent-restaurant/src"]
